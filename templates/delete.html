{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Confirm Delete</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to delete "{{ book.name }}"?</p>
                <p class="text-muted">This action cannot be undone.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg me-2">Yes, Delete</button>
                    <a href="{% url 'book_detail' book.pk %}" class="btn btn-secondary btn-lg">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
